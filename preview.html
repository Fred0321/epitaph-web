<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>预览碑页 · 数字碑</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <div class="brand">数字碑</div>
      <div class="steps" aria-hidden="true">
        <span class="step-dot done"></span>
        <span class="step-dot done"></span>
        <span class="step-dot done"></span>
        <span class="step-dot done"></span>
        <span class="step-dot on"></span>
      </div>
    </div>

    <h2 class="page-title with-diamond">预览碑页</h2>

    <article class="stele" id="stele" aria-label="数字碑预览">
      <h1 class="stele-name" id="pv-name"></h1>
      <p class="stele-epitaph" id="pv-epitaph"></p>
      <div class="portrait" id="pv-portrait" title="照片占位">肖像</div>

      <div class="stele-section">
        <h4>生平纪年</h4>
        <ul class="stele-tl" id="pv-timeline"></ul>
      </div>

      <div class="stele-section" id="pv-msg-wrap">
        <h4>寄语</h4>
        <p class="stele-msg" id="pv-msg"></p>
      </div>
    </article>

    <label class="public-row">
      <span class="public-copy">
        <span class="public-title">公开</span>
        <span class="public-help">默认关闭。保存后，只有打开公开的碑会出现在本机搜索里。</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="is-public" />
        <span class="switch-ui" aria-hidden="true"></span>
      </span>
    </label>

    <div class="preview-actions">
      <button type="button" class="btn btn-primary" id="btn-save">保存</button>
      <button type="button" class="btn btn-primary" id="btn-copy">复制链接</button>
      <a class="btn btn-primary" href="epitaph.html" id="btn-edit">再改改</a>
    </div>

    <p class="share-note">家人打开链接即可阅读</p>

    <div class="share-url">
      <label class="sr-only" for="share-url">分享链接</label>
      <input type="text" id="share-url" readonly aria-label="分享链接（示意）" />
    </div>

    <div id="ornament"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    (function () {
      var app = document.getElementById("app");
      app.insertAdjacentHTML("afterbegin", EpitaphApp.pineCornerHtml());
      document.getElementById("ornament").outerHTML = EpitaphApp.ornamentHtml();

      var data = EpitaphApp.load();
      if (!data.shareId) {
        data.shareId = "demo-" + EpitaphApp.uid("s").slice(-8);
        EpitaphApp.save(data);
      }

      document.getElementById("pv-name").textContent = data.name || "（未填姓名）";
      document.getElementById("pv-epitaph").textContent = data.epitaph || "（未写墓志铭）";

      var tl = document.getElementById("pv-timeline");
      var events = EpitaphApp.sortEvents(data.events || []);
      if (!events.length) {
        var empty = document.createElement("li");
        empty.innerHTML = '<span class="muted">暂无纪年</span>';
        tl.appendChild(empty);
      } else {
        events.forEach(function (ev) {
          var li = document.createElement("li");
          var y = document.createElement("span");
          y.className = "y";
          y.textContent = ev.year + "年";
          li.appendChild(y);
          li.appendChild(document.createTextNode(" · " + (ev.title || "")));
          tl.appendChild(li);
        });
      }

      var msg = (data.familyMessage || "").trim();
      if (msg) {
        document.getElementById("pv-msg").textContent = msg;
      } else {
        document.getElementById("pv-msg-wrap").style.display = "none";
      }

      var url = EpitaphApp.getShareUrl(data.shareId);
      document.getElementById("share-url").value = url;

      document.getElementById("btn-copy").onclick = function () {
        EpitaphApp.copyText(url);
      };

      var pubEl = document.getElementById("is-public");
      pubEl.checked = data.isPublic === true;
      pubEl.addEventListener("change", function () {
        data.isPublic = pubEl.checked;
        EpitaphApp.save(data);
        if (EpitaphData.hasSaved(data.shareId)) {
          EpitaphData.saveStele(data);
          EpitaphApp.toast(data.isPublic ? "已设为公开" : "已改为不公开");
        }
      });

      document.getElementById("btn-save").onclick = function () {
        data.isPublic = pubEl.checked;
        var okDraft = EpitaphApp.save(data);
        var okList = EpitaphData.saveStele(data);
        if (!okDraft || !okList) {
          EpitaphApp.toast("保存失败，请稍后再试");
          return;
        }
        EpitaphApp.toast(data.isPublic ? "已保存，本机搜索可以找到" : "已保存到本机，尚未公开");
      };

      EpitaphApp.mountTabbar("mine", false);
    })();
  </script>
</body>
</html>
